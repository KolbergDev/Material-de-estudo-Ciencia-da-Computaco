<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aula 2</title>
    <style>
      fieldset {
        color: rgb(23, 132, 221);
        font-family:
          Georgia, Times New Roman,Times,serif;
      }
      h1 {
        color: rgb(23, 132, 221);
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1><i>Tabela de Dados</i></h1>
    <hr />
    <form action="sucesso.html" method="get">
      <fieldset>
        <legend>Informações Pessoais</legend>
        <label for="birthday">Data de Nascimento:</label>
        <input type="date" id="birthday" name="birthday" />
        <output for="birthday" name="Idade"></output>
        <br /><br />
        <label for="weight">Peso (Kg):</label>
        <input type="number" id="weight" name="weight" min="10" max="200" />
        <br /><br />
        <label for="ts">Tipo Sanguíneo:</label>
        <select name="tiposanguineo" id="ts">
          <option value="Tipo-A">A</option>
          <option value="Tipo-B">B</option>
          <option value="Tipo-O">O</option>
          <option value="Tipo-AB">AB</option>
        </select>
        <label for="rh">Fator RH:</label>
        <select name="rh" id="rh">
          <option value="positivo">+</option>
          <option value="negativo">-</option>
        </select>
        <br /><br />
        <label for="genero">Gênero:</label>
        <label><input type="radio" name="genero" value="masculino"/>Masculino</label>
        <label><input type="radio" name="genero" value="feminino"  /> Feminino</label>
        <label><input type="radio" name="genero" value="outro" /> Outro</label>
        <br /><br />
        <label for="document">Número de Documento:</label>
        <input type="text" id="document" name="documento" />
        <br><br>
      </fieldset>
      <fieldset>
  <legend>Informações Adicionais</legend>

  <label><input type="checkbox" name="fumante" value="sim"> Fumante</label><br />
  <label><input type="checkbox" name="gestante" value="sim"> Gestante</label><br />
  <label><input type="checkbox" name="alergia" value="sim"> Possui alguma alergia</label><br />
  <label><input type="checkbox" name="cirurgia" value="sim"> Já realizou cirurgia</label><br />
  <label><input type="checkbox" name="medicacao" value="sim"> Faz uso contínuo de medicação</label>
  <br><br>
<input type="submit" value="Enviar">
</fieldset>
    </form>
  </body>
</html>
